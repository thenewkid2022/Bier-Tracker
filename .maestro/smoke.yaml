# Maestro E2E Smoke-Test – https://maestro.mobile.dev
#
# Ausführen (Dev-Client oder Build muss auf Simulator/Emulator installiert sein):
#   maestro test .maestro/smoke.yaml
#
# Für iOS/Android unterschiedliche IDs: via --env APP_ID=... überschreiben.
appId: ${APP_ID}
env:
  APP_ID: com.ragnarus.getraenketracker
---
- launchApp:
    clearState: true

# Home: Demo-Daten sind geladen
- assertVisible: 'Getränke Tracker'
- assertVisible: 'Wer trinkt?'
- assertVisible: 'Max Mustermann'
- assertVisible: 'Bier'

# Kauf-Flow: ein Tipp auf das Getränk bucht genau 1 Stück (Bestätigung als Toast)
- tapOn: 'Max Mustermann'
- tapOn:
    text: 'Bier'
    index: 0
- assertVisible: '1× Bier für Max Mustermann gebucht'

# Profil-Tab zeigt den Kauf
- tapOn: 'Profil'
- assertVisible: 'Max Mustermann'
- assertVisible: 'Letzte Einkäufe'
- assertVisible: 'Bier'

# Admin-Tab: PIN-Gate
- tapOn: 'Admin'
- assertVisible: 'Admin-Bereich'
- tapOn: 'PIN eingeben'
- inputText: '1234'
- tapOn: 'Entsperren'
- assertVisible: 'Verwaltung'
- assertVisible: 'Benutzer'
- assertVisible: 'Getränke'
