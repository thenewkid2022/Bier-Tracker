# Maestro E2E Smoke-Test – https://maestro.mobile.dev
#
# Ausführen (Dev-Client oder Build muss auf Simulator/Emulator installiert sein):
#   maestro test .maestro/smoke.yaml
#
# Für iOS/Android unterschiedliche IDs: via --env APP_ID=... überschreiben.
appId: ${APP_ID}
env:
  APP_ID: com.ragnarus.getraenketracker
---
- launchApp:
    clearState: true

# Home: Demo-Daten sind geladen
- assertVisible: 'Getränke Tracker'
- assertVisible: 'Benutzer auswählen'
- assertVisible: 'Max Mustermann'
- assertVisible: 'Bier'

# Kauf-Flow: Getränk antippen -> Mengen-Modal -> bestätigen
- tapOn: 'Max Mustermann'
- tapOn:
    text: 'Bier'
    index: 0
- assertVisible: 'Menge auswählen'
- tapOn: 'Kaufen'
- assertVisible: 'Erfolg'
- tapOn: 'OK'

# Profil-Tab zeigt den Kauf
- tapOn: 'Profil'
- assertVisible: 'Max Mustermann'
- assertVisible: 'Bier'

# Admin-Tab: PIN-Gate
- tapOn: 'Admin'
- assertVisible: 'Admin-Zugang'
- tapOn: 'PIN-Code eingeben'
- inputText: '1234'
- tapOn: 'Anmelden'
- assertVisible: 'Admin-Bereich'
- assertVisible: 'Benutzer-Verwaltung'
- assertVisible: 'Getränke-Verwaltung'
